     - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "===== UPDATE GRADLE ====="

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER" ]]; then
            echo "::error::Không tìm thấy Gradle wrapper"
            exit 1
          fi

          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' "$WRAPPER"

          echo "===== CHECK GRADLE VERSION ====="

          cd android
          chmod +x gradlew
          ./gradlew --version

          cd ..

          echo "===== CHECK GRADLE CONFIGURATION ====="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

          echo "===== BUILD APK ====="

          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/Our-Days-V4.8.apk"

          echo "BUILD SUCCESS"
