
name: Our Days APK - Gradle 9.3.1 FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Our Days Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn
      - name: Checkout source
        uses: actions/checkout@v7

      # 2. Giải nén dự án Flutter
      - name: Extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SEARCH ZIP ====="

          ZIP="$(find . -type f \
            -name 'our-days-native-v4.8-phone-build.zip' \
            -print -quit)"

          if [[ -z "$ZIP" ]]; then
            echo "::error::Không tìm thấy file ZIP dự án."
            exit 1
          fi

          echo "ZIP: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PUBSPEC="$(find extracted -type f \
            -name pubspec.yaml -print -quit)"

          if [[ -z "$PUBSPEC" ]]; then
            echo "::error::ZIP không chứa pubspec.yaml."
            exit 1
          fi

          PROJECT_DIR="${PUBSPEC%/pubspec.yaml}"

          if [[ ! -f "$PROJECT_DIR/lib/main.dart" ]]; then
            echo "::error::Không tìm thấy lib/main.dart."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "===== PROJECT FOUND ====="
          echo "$PROJECT_DIR"

      # 3. Cài Java 17
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 4. Cài Flutter Stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      # 5. Chuẩn bị Android
      - name: Prepare Android
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [[ ! -d android ]]; then
            echo "Android folder chưa có, đang tạo..."
            flutter create --platforms=android .
          fi

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER" ]]; then
            echo "::error::Không tìm thấy Gradle wrapper."
            exit 1
          fi

          echo "Android project đã sẵn sàng."

      # 6. Cài thư viện
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # 7. Nâng Gradle và Build APK
      - name: Build APK - FORCE GRADLE 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          echo "===== WORKFLOW VERSION: GRADLE 9.3.1 FIX ====="

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER" ]]; then
            echo "::error::Không tìm thấy $WRAPPER"
            exit 1
          fi

          # Sửa trực tiếp Gradle wrapper
          python3 - "$WRAPPER" <<'PY'
          from pathlib import Path
          import sys

          wrapper = Path(sys.argv[1])

          if not wrapper.is_file():
              raise SystemExit("Không tìm thấy gradle-wrapper.properties")

          lines = wrapper.read_text(encoding="utf-8").splitlines()

          indexes = [
              i for i, line in enumerate(lines)
              if line.strip().startswith("distributionUrl=")
          ]

          if len(indexes) != 1:
              raise SystemExit(
                  f"Cần đúng 1 dòng distributionUrl, tìm thấy {len(indexes)}"
              )

          lines[indexes[0]] = (
              r"distributionUrl=https\://services.gradle.org/"
              r"distributions/gradle-9.3.1-bin.zip"
          )

          wrapper.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Đã đặt Gradle wrapper thành 9.3.1.")
          PY

          # Kiểm tra cấu hình wrapper
          echo "===== CHECK WRAPPER FILE ====="
          grep "distributionUrl" "$WRAPPER"

          # Kiểm tra Gradle thực sự đang chạy
          echo "===== CHECK ACTUAL GRADLE VERSION ====="

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          GRADLE_INFO="$(./gradlew --version)"

          printf '%s\n' "$GRADLE_INFO"

          if ! grep -Fq "Gradle 9.3.1" <<< "$GRADLE_INFO"; then
            echo "::error::Gradle không phải phiên bản 9.3.1."
            exit 1
          fi

          echo "===== GRADLE 9.3.1 VERIFIED ====="

          # Chạy biên dịch APK
          cd "$PROJECT_DIR"

          echo "===== START FLUTTER APK BUILD ====="

          flutter build apk --release

          # Kiểm tra APK
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Build xong nhưng không tìm thấy APK."
            exit 1
          fi

          # Đưa APK ra thư mục chính
          cp "$APK_PATH" "$GITHUB_WORKSPACE/Our-Days-V4.8.apk"

          echo "===== APK BUILD SUCCESS ====="

      # 8. Xuất APK để tải về
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Our-Days-V4.8-APK
          path: Our-Days-V4.8.apk
          if-no-files-found: error
          retention-days: 7
